<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyTrade - Easy Earns</title>
    <script src="theme.js"></script>
    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" />
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --text-faint: #9ca3af;
            --border: #e5e7eb;
            --brand: #4361ee;
            --brand-soft: #e8eefc;
            --shadow: rgba(15, 23, 42, 0.06);
            --success-bg: #e7f7ed; --success-text: #2f855a;
            --locked-bg: #f3f4f6; --locked-text: #9ca3af;
            --danger-text: #ef4444;
            --warning-text: #b7791f;
        }
        [data-theme="dark"] {
            --bg: #0f1115;
            --surface: #1a1d24;
            --text-primary: #e5e7eb;
            --text-secondary: #cbd1db;
            --text-muted: #9ca3af;
            --text-faint: #6b7280;
            --border: #2d3139;
            --brand: #6b83ff;
            --brand-soft: #1e2544;
            --shadow: rgba(0, 0, 0, 0.4);
            --success-bg: #16321f; --success-text: #4ade80;
            --locked-bg: #20242c; --locked-text: #6b7280;
            --danger-text: #f87171;
            --warning-text: #fbbf24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn, .primary-btn {
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: var(--brand-soft);
            color: var(--brand);
        }

        .primary-btn {
            background: var(--brand);
            color: white;
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hero {
            background: var(--brand);
            color: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(67, 97, 238, 0.18);
            margin-bottom: 20px;
        }

        .hero h1 {
            margin: 8px 0 8px;
            font-size: 26px;
        }

        .hero p {
            margin: 0;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 700px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--surface);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 8px 24px var(--shadow);
        }

        .card h3 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.ready { background: var(--success-bg); color: var(--success-text); }
        .status.locked { background: var(--locked-bg); color: var(--locked-text); }

        .empty-state-text {
            color: var(--text-muted);
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 760px) {
            .grid { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; align-items: flex-start; }
            .hero { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a href="tasks.html" class="back-btn"><i class="las la-arrow-left"></i> Back</a>
            <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-weight:700; color:var(--text-secondary);">Easy Earns</span>
            </div>
        </div>

        <section class="hero" style="padding:18px; border-radius:12px; margin-bottom:18px;">
            <h1 style="margin:0 0 8px; font-size:22px;">Easy Earns</h1>
            <p style="margin:0; color:rgba(255,255,255,0.95);">Pick one task category to complete today. Finish it to earn your reward - the other categories unlock again tomorrow.</p>
        </section>

        <div id="easyEarnsList"><div style="color:var(--text-muted)">Loading tasks...</div></div>
    </div>

    <script>
        let easyEarnTasksData = [];
        let todayStatusData = { claimed: false, category: null, amount: 0 };
        let photoSurveyCountdownInterval = null;

        function escapeHtml(s){ return String(s||'').replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

        const CATEGORY_META = {
            video: { label: 'Watch & Earn', icon: 'la-play-circle', render: renderVideoCategory },
            quiz: { label: 'Quick Quiz', icon: 'la-question-circle', render: renderQuizCategory },
            poll: { label: 'Quick Poll', icon: 'la-poll-h', render: renderPollCategory },
            photo_survey: { label: 'Photo Survey', icon: 'la-camera', render: renderPhotoSurveyCategory }
        };

        async function refreshTodayStatus() {
            try {
                todayStatusData = await window.API.getEasyEarnStatusToday();
            } catch (err) {
                console.error('Failed to load today status', err);
            }
        }

        function renderCategoryGrid() {
            const listEl = document.getElementById('easyEarnsList');
            if (!easyEarnTasksData.length) {
                listEl.innerHTML = '<div class="empty-state-text">No Easy Earns tasks are active right now.</div>';
                return;
            }

            listEl.innerHTML = '<div class="grid" id="categoryGrid"></div><div id="categoryDetail"></div>';
            const grid = document.getElementById('categoryGrid');

            grid.innerHTML = easyEarnTasksData.map(task => {
                const meta = CATEGORY_META[task.category] || { label: task.title, icon: 'la-star' };
                const isTodaysCategory = todayStatusData.claimed && todayStatusData.category === task.category;
                const isLocked = todayStatusData.claimed && !isTodaysCategory;

                let actionHtml;
                if (isTodaysCategory) {
                    actionHtml = '<div class="status ready" style="margin-top:10px;">Completed today</div>';
                } else if (isLocked) {
                    actionHtml = '<div class="status locked" style="margin-top:10px;">Locked - come back tomorrow</div>';
                } else {
                    actionHtml = `<button type="button" class="primary-btn" style="margin-top:10px;" onclick="openCategory('${task.id}')">Start</button>`;
                }

                return `
                    <div class="card">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                            <i class="las ${meta.icon}" style="font-size:20px; color:var(--brand);"></i>
                            <h3 style="margin:0;">${escapeHtml(meta.label)}</h3>
                        </div>
                        <p style="color:var(--text-muted); font-size:14px; margin-bottom:8px;">${escapeHtml(task.description || '')}</p>
                        <div style="font-size:13px; font-weight:600; color:var(--text-secondary);">Reward: GHC ${parseFloat(task.amount || 0).toFixed(2)}</div>
                        ${actionHtml}
                    </div>
                `;
            }).join('');
        }

        function openCategory(taskId) {
            const task = easyEarnTasksData.find(t => t.id === taskId);
            if (!task) return;
            const meta = CATEGORY_META[task.category];
            if (!meta || !meta.render) {
                document.getElementById('categoryDetail').innerHTML = '<div class="card"><p style="color:var(--danger-text);">Unknown task type.</p></div>';
                return;
            }
            meta.render(task);
            document.getElementById('categoryDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        window.openCategory = openCategory;

        // --- Watch & Earn (video) ---
        async function renderVideoCategory(task) {
            const container = document.getElementById('categoryDetail');
            container.innerHTML = '<div class="card"><p style="color:var(--text-muted);">Loading videos...</p></div>';

            try {
                const vids = await window.API.getEasyEarnVideos(task.id);
                if (!vids || vids.length === 0) {
                    container.innerHTML = '<div class="card"><p>No videos configured for this task yet.</p></div>';
                    return;
                }

                function isYouTubeUrl(u) { return /youtube\.com|youtu\.be/.test(u || ''); }
                function extractYouTubeId(u) {
                    try {
                        const m = u.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
                        if (m && m[1]) return m[1];
                        const short = u.match(/youtu\.be\/(.+)$/);
                        return short ? short[1].split('?')[0] : null;
                    } catch (e) { return null; }
                }

                const watched = new Set();
                const ytPlayers = [];

                container.innerHTML = `
                    <div class="card">
                        <h3>${escapeHtml(task.title)}</h3>
                        <p style="color:var(--text-muted); margin-bottom:10px;">${escapeHtml(task.description || '')} Reward: GHC ${parseFloat(task.amount || 0).toFixed(2)}</p>
                        <div id="videoContainer"></div>
                        <div id="videoProgress" style="font-size:13px; color:var(--text-faint); margin-top:8px;">0/${vids.length} watched</div>
                    </div>
                `;

                const videoContainer = document.getElementById('videoContainer');
                const progress = document.getElementById('videoProgress');

                videoContainer.innerHTML = vids.map(v => {
                    const title = escapeHtml(v.title || ('Video ' + v.video_index));
                    if (isYouTubeUrl(v.url)) {
                        const vid = extractYouTubeId(v.url);
                        return `<div style="margin-bottom:10px; width:100%;">
                            <div style="font-weight:600; margin-bottom:6px;">${title}</div>
                            <div id="yt_player_${v.video_index}" data-yt-id="${vid || ''}" style="width:100%; height:240px; background:#000; border-radius:10px; overflow:hidden;"></div>
                        </div>`;
                    }
                    return `<div style="margin-bottom:10px; width:100%;">
                        <div style="font-weight:600; margin-bottom:6px;">${title}</div>
                        <video id="video_${v.video_index}" width="100%" controls preload="metadata" style="border-radius:10px; background:#000;">
                            <source src="${escapeHtml(v.url || '')}" type="video/mp4">
                            Your browser does not support HTML5 video.
                        </video>
                    </div>`;
                }).join('');

                function attemptAutoClaim() {
                    return (async () => {
                        progress.textContent = 'All videos watched - claiming reward...';
                        try {
                            const resp = await window.API.claimEasyEarn(task.id);
                            progress.style.color = 'var(--success-text)';
                            progress.textContent = `Reward credited: GHC ${parseFloat(resp.earned || 0).toFixed(2)}`;
                            await refreshTodayStatus();
                            renderCategoryGrid();
                            await window.API.getWallet().catch(() => {});
                            window.dispatchEvent(new Event('userFinanceUpdated'));
                        } catch (err) {
                            progress.style.color = 'var(--danger-text)';
                            progress.textContent = err.message || 'Claim failed';
                        }
                    })();
                }

                vids.forEach(v => {
                    if (!isYouTubeUrl(v.url)) {
                        const vidEl = document.getElementById('video_' + v.video_index);
                        if (!vidEl) return;
                        vidEl.addEventListener('ended', async () => {
                            watched.add(v.video_index);
                            progress.textContent = `${watched.size}/${vids.length} watched`;
                            if (watched.size === vids.length) await attemptAutoClaim();
                        });
                    }
                });

                const ytContainers = videoContainer.querySelectorAll('[id^="yt_player_"]');
                if (ytContainers.length > 0) {
                    if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
                        if (!document.getElementById('youtube-iframe-api')) {
                            const s = document.createElement('script');
                            s.id = 'youtube-iframe-api';
                            s.src = 'https://www.youtube.com/iframe_api';
                            document.head.appendChild(s);
                        }
                    }

                    function initYouTubePlayers() {
                        ytContainers.forEach(el => {
                            const id = el.id;
                            const videoId = el.getAttribute('data-yt-id');
                            if (!videoId) return;
                            const idxMatch = id.match(/yt_player_(\d+)$/);
                            const vIndex = idxMatch ? Number(idxMatch[1]) : null;
                            const player = new YT.Player(id, {
                                videoId: videoId,
                                playerVars: { controls: 1, rel: 0 },
                                events: {
                                    onStateChange: function(event) {
                                        if (event.data === YT.PlayerState.ENDED) {
                                            watched.add(vIndex);
                                            progress.textContent = `${watched.size}/${vids.length} watched`;
                                            if (watched.size === vids.length) attemptAutoClaim();
                                        }
                                    }
                                }
                            });
                            ytPlayers.push(player);
                        });
                    }

                    if (typeof YT !== 'undefined' && typeof YT.Player !== 'undefined') {
                        initYouTubePlayers();
                    } else {
                        const prev = window.onYouTubeIframeAPIReady;
                        window.onYouTubeIframeAPIReady = function() {
                            if (typeof prev === 'function') prev();
                            initYouTubePlayers();
                        };
                    }
                }
            } catch (err) {
                console.error('Failed to load videos for task', task.id, err);
                container.innerHTML = '<div class="card"><p style="color:var(--danger-text);">Failed to load videos</p></div>';
            }
        }

        // --- Quick Quiz ---
        async function renderQuizCategory(task) {
            const container = document.getElementById('categoryDetail');
            container.innerHTML = '<div class="card"><p style="color:var(--text-muted);">Loading quiz...</p></div>';

            try {
                const questions = await window.API.getQuizQuestions(task.id);
                if (!questions.length) {
                    container.innerHTML = '<div class="card"><p>No quiz questions configured yet.</p></div>';
                    return;
                }

                container.innerHTML = `
                    <div class="card">
                        <h3>${escapeHtml(task.title)}</h3>
                        <p style="color:var(--text-muted); margin-bottom:14px;">${escapeHtml(task.description || '')} Reward: GHC ${parseFloat(task.amount || 0).toFixed(2)} (all answers must be correct)</p>
                        <form id="quizForm">
                            ${questions.map((q, qi) => `
                                <div style="margin-bottom:16px;">
                                    <div style="font-weight:600; margin-bottom:8px;">${qi + 1}. ${escapeHtml(q.question_text)}</div>
                                    ${(q.options || []).map((opt, oi) => `
                                        <label style="display:block; margin-bottom:6px; font-size:14px; cursor:pointer;">
                                            <input type="radio" name="q_${q.id}" value="${oi}" required style="margin-right:8px;">
                                            ${escapeHtml(opt)}
                                        </label>
                                    `).join('')}
                                </div>
                            `).join('')}
                            <button type="submit" class="primary-btn" id="quizSubmitBtn">Submit Answers</button>
                        </form>
                        <div id="quizResult" style="margin-top:12px; font-size:14px;"></div>
                    </div>
                `;

                document.getElementById('quizForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const answers = questions.map(q => {
                        const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                        return { question_id: q.id, selected_option_index: selected ? parseInt(selected.value, 10) : -1 };
                    });
                    const btn = document.getElementById('quizSubmitBtn');
                    const resultEl = document.getElementById('quizResult');
                    btn.disabled = true;
                    btn.textContent = 'Submitting...';
                    resultEl.textContent = '';

                    try {
                        const res = await window.API.submitQuiz(task.id, answers);
                        resultEl.style.color = 'var(--success-text)';
                        resultEl.textContent = `Correct! You earned GHC ${parseFloat(res.earned || 0).toFixed(2)}.`;
                        await refreshTodayStatus();
                        renderCategoryGrid();
                        window.dispatchEvent(new Event('userFinanceUpdated'));
                    } catch (err) {
                        resultEl.style.color = 'var(--danger-text)';
                        resultEl.textContent = err.message || 'Submission failed';
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Submit Answers';
                    }
                });
            } catch (err) {
                console.error('Failed to load quiz', err);
                container.innerHTML = '<div class="card"><p style="color:var(--danger-text);">Failed to load quiz.</p></div>';
            }
        }

        // --- Quick Poll ---
        async function renderPollCategory(task) {
            const container = document.getElementById('categoryDetail');
            container.innerHTML = '<div class="card"><p style="color:var(--text-muted);">Loading poll...</p></div>';

            try {
                const options = await window.API.getPollOptions(task.id);
                if (!options.length) {
                    container.innerHTML = '<div class="card"><p>No poll options configured yet.</p></div>';
                    return;
                }

                container.innerHTML = `
                    <div class="card">
                        <h3>${escapeHtml(task.title)}</h3>
                        <p style="color:var(--text-muted); margin-bottom:14px;">${escapeHtml(task.description || '')} Reward: GHC ${parseFloat(task.amount || 0).toFixed(2)}</p>
                        <form id="pollForm">
                            ${options.map(opt => `
                                <label style="display:block; margin-bottom:8px; font-size:14px; cursor:pointer;">
                                    <input type="radio" name="pollOption" value="${opt.id}" required style="margin-right:8px;">
                                    ${escapeHtml(opt.option_text)}
                                </label>
                            `).join('')}
                            <button type="submit" class="primary-btn" id="pollSubmitBtn" style="margin-top:8px;">Submit</button>
                        </form>
                        <div id="pollResult" style="margin-top:12px; font-size:14px;"></div>
                    </div>
                `;

                document.getElementById('pollForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const selected = document.querySelector('input[name="pollOption"]:checked');
                    if (!selected) return;
                    const btn = document.getElementById('pollSubmitBtn');
                    const resultEl = document.getElementById('pollResult');
                    btn.disabled = true;
                    btn.textContent = 'Submitting...';

                    try {
                        const res = await window.API.submitPoll(task.id, selected.value);
                        resultEl.style.color = 'var(--success-text)';
                        resultEl.textContent = `Thanks! You earned GHC ${parseFloat(res.earned || 0).toFixed(2)}.`;
                        await refreshTodayStatus();
                        renderCategoryGrid();
                        window.dispatchEvent(new Event('userFinanceUpdated'));
                    } catch (err) {
                        resultEl.style.color = 'var(--danger-text)';
                        resultEl.textContent = err.message || 'Submission failed';
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Submit';
                    }
                });
            } catch (err) {
                console.error('Failed to load poll', err);
                container.innerHTML = '<div class="card"><p style="color:var(--danger-text);">Failed to load poll.</p></div>';
            }
        }

        // --- Photo Survey ---
        async function renderPhotoSurveyCategory(task) {
            const container = document.getElementById('categoryDetail');
            container.innerHTML = '<div class="card"><p style="color:var(--text-muted);">Loading photo survey...</p></div>';
            if (photoSurveyCountdownInterval) { clearInterval(photoSurveyCountdownInterval); photoSurveyCountdownInterval = null; }

            try {
                const status = await window.API.getPhotoSurveyToday(task.id);
                if (!status.prompts || status.prompts.length === 0) {
                    container.innerHTML = '<div class="card"><p>No photo prompts configured yet.</p></div>';
                    return;
                }

                if (status.completedCount >= status.total) {
                    container.innerHTML = `
                        <div class="card">
                            <h3>${escapeHtml(task.title)}</h3>
                            <p style="color:var(--success-text); margin-top:10px;">You've completed all ${status.total} photos for today. Come back tomorrow for more!</p>
                        </div>
                    `;
                    return;
                }

                const doneIndexes = new Set((status.submissions || []).map(s => s.prompt_index));
                const nextPrompt = status.prompts.find(p => !doneIndexes.has(p.prompt_index));
                const nextAvailableAt = status.nextAvailableAt ? new Date(status.nextAvailableAt) : null;

                container.innerHTML = `
                    <div class="card">
                        <h3>${escapeHtml(task.title)}</h3>
                        <p style="color:var(--text-muted); margin-bottom:14px;">${escapeHtml(task.description || '')} Reward: GHC ${parseFloat(task.amount || 0).toFixed(2)} for all ${status.total} photos.</p>
                        <div style="font-weight:600; margin-bottom:10px;">Progress: ${status.completedCount}/${status.total} photos</div>
                        <div id="photoWaitNotice" style="display:none; color:var(--warning-text); font-size:13px; margin-bottom:10px;"></div>
                        <div id="photoPromptSection"></div>
                        <div id="photoResult" style="margin-top:12px; font-size:14px;"></div>
                    </div>
                `;

                function renderPromptForm() {
                    const promptSection = document.getElementById('photoPromptSection');
                    if (!nextPrompt) {
                        promptSection.innerHTML = '<p style="color:var(--danger-text);">No prompt available for your next photo. Contact support.</p>';
                        return;
                    }
                    promptSection.innerHTML = `
                        <div style="border:1px solid var(--border); border-radius:12px; padding:14px;">
                            <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); margin-bottom:6px;">${escapeHtml(nextPrompt.prompt_category || 'object')}</div>
                            <div style="font-weight:600; margin-bottom:12px;">${escapeHtml(nextPrompt.prompt_text)}</div>
                            <input type="file" id="photoFileInput" accept="image/*" capture="environment" style="margin-bottom:10px; display:block;">
                            <input type="text" id="photoCaptionInput" placeholder="Caption: location, object name, or description" style="padding:10px; border:1px solid var(--border); border-radius:8px; width:100%; margin-bottom:10px; box-sizing:border-box;">
                            <button type="button" class="primary-btn" id="photoSubmitBtn">Upload Photo</button>
                        </div>
                    `;

                    document.getElementById('photoSubmitBtn').addEventListener('click', async () => {
                        const fileInput = document.getElementById('photoFileInput');
                        const caption = document.getElementById('photoCaptionInput').value.trim();
                        const resultEl = document.getElementById('photoResult');
                        resultEl.textContent = '';

                        if (!fileInput.files || !fileInput.files[0]) {
                            resultEl.style.color = 'var(--danger-text)';
                            resultEl.textContent = 'Please choose or take a photo first.';
                            return;
                        }
                        if (!caption) {
                            resultEl.style.color = 'var(--danger-text)';
                            resultEl.textContent = 'Please add a caption.';
                            return;
                        }

                        const btn = document.getElementById('photoSubmitBtn');
                        btn.disabled = true;
                        btn.textContent = 'Uploading...';
                        try {
                            const photoUrl = await window.uploadToCloudinary(fileInput.files[0]);
                            const res = await window.API.submitPhotoSurveyPhoto(task.id, {
                                prompt_index: nextPrompt.prompt_index,
                                photo_url: photoUrl,
                                caption
                            });

                            if (res.rewardCredited) {
                                resultEl.style.color = 'var(--success-text)';
                                resultEl.textContent = `All ${res.total} photos done! You earned GHC ${parseFloat(res.earned || 0).toFixed(2)}.`;
                                await refreshTodayStatus();
                                renderCategoryGrid();
                                window.dispatchEvent(new Event('userFinanceUpdated'));
                            } else {
                                resultEl.style.color = 'var(--success-text)';
                                resultEl.textContent = `Photo ${res.completedCount}/${res.total} saved. Next photo unlocks in 3 minutes.`;
                                startWaitCountdown(new Date(res.next_available_at));
                            }
                        } catch (err) {
                            resultEl.style.color = 'var(--danger-text)';
                            resultEl.textContent = err.message || 'Upload failed';
                        } finally {
                            btn.disabled = false;
                            btn.textContent = 'Upload Photo';
                        }
                    });
                }

                function startWaitCountdown(nextAt) {
                    const promptSection = document.getElementById('photoPromptSection');
                    const notice = document.getElementById('photoWaitNotice');
                    promptSection.innerHTML = '';
                    notice.style.display = 'block';

                    function tick() {
                        const msLeft = nextAt.getTime() - Date.now();
                        if (msLeft <= 0) {
                            clearInterval(photoSurveyCountdownInterval);
                            photoSurveyCountdownInterval = null;
                            notice.style.display = 'none';
                            renderPhotoSurveyCategory(task);
                            return;
                        }
                        const secondsLeft = Math.ceil(msLeft / 1000);
                        const m = Math.floor(secondsLeft / 60);
                        const s = secondsLeft % 60;
                        notice.textContent = `Next photo unlocks in ${m}:${String(s).padStart(2, '0')}`;
                    }
                    tick();
                    photoSurveyCountdownInterval = setInterval(tick, 1000);
                }

                if (nextAvailableAt && nextAvailableAt.getTime() > Date.now()) {
                    startWaitCountdown(nextAvailableAt);
                } else {
                    renderPromptForm();
                }
            } catch (err) {
                console.error('Failed to load photo survey', err);
                container.innerHTML = '<div class="card"><p style="color:var(--danger-text);">Failed to load photo survey.</p></div>';
            }
        }

        async function loadEasyEarns() {
            const listEl = document.getElementById('easyEarnsList');
            listEl.innerHTML = '<div style="color:var(--text-muted)">Loading tasks...</div>';
            try {
                const [tasks] = await Promise.all([window.API.getEasyEarns(), refreshTodayStatus()]);
                easyEarnTasksData = Array.isArray(tasks) ? tasks : [];
                renderCategoryGrid();
            } catch (err) {
                console.error('Failed to load Easy Earns tasks', err);
                listEl.innerHTML = '<div style="color:var(--danger-text)">Failed to load tasks. Please try again later.</div>';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadEasyEarns);
        } else {
            loadEasyEarns();
        }
    </script>
</body>
</html>
