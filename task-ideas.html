<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyTrade - Easy Earns</title>
    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn, .primary-btn {
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: #e8eefc;
            color: #4361ee;
        }

        .primary-btn {
            background: #4361ee;
            color: white;
        }

        .hero {
            background: #4361ee;
            color: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(67, 97, 238, 0.18);
            margin-bottom: 20px;
        }

        .hero h1 {
            margin: 8px 0 8px;
            font-size: 26px;
        }

        .hero p {
            margin: 0;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 700px;
        }

        .pill {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.2);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .card h3 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .card ul, .card ol {
            padding-left: 18px;
            margin: 0;
            line-height: 1.7;
            color: #4b5563;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status.planned { background: #e8f2ff; color: #2b6df0; }
        .status.in-progress { background: #fff4d6; color: #b7791f; }
        .status.ready { background: #e7f7ed; color: #2f855a; }

        .idea-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .idea-item {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .idea-item strong { display: block; margin-bottom: 6px; }
        .idea-item p { margin: 0; color: #6b7280; font-size: 14px; }

        @media (max-width: 760px) {
            .grid { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; align-items: flex-start; }
            .hero { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a href="tasks.html" class="back-btn"><i class="las la-arrow-left"></i> Back</a>
            <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-weight:700; color:#374151;">Easy Earns</span>
            </div>
        </div>

        <section class="hero" style="padding:18px; border-radius:12px; margin-bottom:18px;">
            <h1 style="margin:0 0 8px; font-size:22px;">Easy Earns</h1>
            <p style="margin:0; color:#6b7280;">Complete short video tasks to earn rewards. Watch all listed videos in a task — rewards are credited automatically when you finish watching.</p>
        </section>

        <div id="easyEarnsList" style="display:flex; flex-direction:column; gap:12px; margin-top:6px;"></div>
    </div>

    <!-- Modal -->
    <div id="easyModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:9999;">
        <div style="background:white; border-radius:12px; width:94%; max-width:640px; padding:18px;">
            <h3 id="modalTitle">Start Task</h3>
            <p id="modalDesc" style="color:#4b5563; margin-top:6px;"></p>
            <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
                <label style="font-weight:700; font-size:13px;">Proof URL or notes</label>
                <input id="proofInput" type="text" placeholder="Paste screenshot URL or short notes" style="padding:10px; border:1px solid #e5e7eb; border-radius:8px; width:100%;" />
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button id="submitProofBtn" class="primary-btn" style="flex:1;">Submit Proof</button>
                    <button id="claimRewardBtn" class="back-btn" style="flex:1; background:#e6ffef; color:#087f41; display:none;">Claim Reward</button>
                </div>
                <button id="closeModalBtn" class="back-btn" style="margin-top:12px; background:#f3f4f6; color:#374151;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Easy Earns frontend: loads beginner tasks and allows submit/claim flows
        async function loadEasyEarns() {
            const listEl = document.getElementById('easyEarnsList');
            listEl.innerHTML = '<div style="color:#6b7280">Loading tasks...</div>';
            try {
                const tasks = await window.API.getEasyEarns();
                if (!Array.isArray(tasks) || tasks.length === 0) {
                    listEl.innerHTML = '<div class="empty-state-text">No Easy Earns tasks are active right now.</div>';
                    return;
                }

                listEl.innerHTML = '';
                tasks.forEach(task => {
                    const item = document.createElement('div');
                    item.className = 'idea-item';
                    item.innerHTML = `
                        <div style="flex:1">
                            <strong>${escapeHtml(task.title)}</strong>
                            <p>${escapeHtml(task.description || '')}</p>
                            <div style="margin-top:8px; font-size:13px; color:#6b7280">Reward: GHC ${parseFloat(task.amount||0).toFixed(2)}</div>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:8px; min-width:260px; align-items:flex-end;">
                            <div id="videoContainer_${task.id}" style="width:100%;"></div>
                            <div id="videoProgress_${task.id}" style="font-size:12px; color:#9ca3af; text-align:right;">Loading videos...</div>
                        </div>
                    `;
                    listEl.appendChild(item);

                    // Load videos for this easy-earn task and render players
                    (async function(t) {
                        try {
                            const vids = await window.API.getEasyEarnVideos(t.id);
                            const container = document.getElementById('videoContainer_' + t.id);
                            const progress = document.getElementById('videoProgress_' + t.id);
                            if (!vids || vids.length === 0) {
                                container.innerHTML = '<div style="color:#6b7280">No videos configured for this task yet.</div>';
                                progress.textContent = '';
                                return;
                            }

                            // Helper to detect YouTube URLs
                            function isYouTubeUrl(u) {
                                return /youtube\.com|youtu\.be/.test(u || '');
                            }

                            function extractYouTubeId(u) {
                                try {
                                    const m = u.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
                                    if (m && m[1]) return m[1];
                                    const short = u.match(/youtu\.be\/(.+)$/);
                                    return short ? short[1].split('?')[0] : null;
                                } catch (e) { return null; }
                            }

                            // Track watched videos
                            const watched = new Set();
                            // Keep YouTube players to prevent GC
                            const ytPlayers = [];

                            // Build placeholders
                            container.innerHTML = vids.map(v => {
                                const title = escapeHtml(v.title || ('Video ' + v.video_index));
                                if (isYouTubeUrl(v.url)) {
                                    const vid = extractYouTubeId(v.url);
                                    return `\n                                <div style="margin-bottom:10px; width:100%;">\n                                    <div style="font-weight:600; margin-bottom:6px;">${title}</div>\n                                    <div id="yt_player_${t.id}_${v.video_index}" data-yt-id="${vid || ''}" style="width:100%; height:240px; background:#000; border-radius:10px; overflow:hidden;"></div>\n                                </div>\n                            `;
                                }
                                // fallback to HTML5 video
                                return `\n                                <div style="margin-bottom:10px; width:100%;">\n                                    <div style="font-weight:600; margin-bottom:6px;">${title}</div>\n                                    <video id="video_${t.id}_${v.video_index}" width="100%" controls preload="metadata" style="border-radius:10px; background:#000;">\n                                        <source src="${escapeAttr(v.url || '')}" type="video/mp4">\n                                        Your browser does not support HTML5 video.\n                                    </video>\n                                </div>\n                            `;
                            }).join('');

                            progress.textContent = `0/${vids.length} watched`;

                            // Attach HTML5 video listeners
                            vids.forEach(v => {
                                if (!isYouTubeUrl(v.url)) {
                                    const vidEl = document.getElementById('video_' + t.id + '_' + v.video_index);
                                    if (!vidEl) return;
                                    vidEl.addEventListener('ended', async () => {
                                        watched.add(v.video_index);
                                        progress.textContent = `${watched.size}/${vids.length} watched`;
                                        if (watched.size === vids.length) await attemptAutoClaim();
                                    });
                                }
                            });

                            // YouTube: load API and create players
                            const ytContainers = container.querySelectorAll('[id^="yt_player_"]');
                            function attemptAutoClaim() {
                                return (async () => {
                                    progress.textContent = 'All videos watched — claiming reward...';
                                    try {
                                        const resp = await window.API.claimEasyEarn(t.id);
                                        if (resp && resp.ok) {
                                            alert(`Reward credited: GHC ${parseFloat(resp.earned||0).toFixed(2)}`);
                                            await window.API.getWallet().catch(()=>{});
                                            loadEasyEarns();
                                            window.dispatchEvent(new Event('userFinanceUpdated'));
                                        } else {
                                            alert(resp.message || 'Claim response received');
                                        }
                                    } catch (err) {
                                        console.error('Auto-claim failed:', err);
                                        progress.textContent = 'Claim failed — try submitting proof manually.';
                                    }
                                })();
                            }

                            if (ytContainers.length > 0) {
                                // Load YouTube IFrame API if not present
                                if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
                                    // Inject API
                                    if (!document.getElementById('youtube-iframe-api')) {
                                        const s = document.createElement('script');
                                        s.id = 'youtube-iframe-api';
                                        s.src = 'https://www.youtube.com/iframe_api';
                                        document.head.appendChild(s);
                                    }
                                }

                                // When API ready, initialize players
                                function initYouTubePlayers() {
                                    ytContainers.forEach(el => {
                                        const id = el.id;
                                        const videoId = el.getAttribute('data-yt-id');
                                        if (!videoId) return;
                                        const idxMatch = id.match(/yt_player_(.+)_(\d+)$/);
                                        const vIndex = idxMatch ? Number(idxMatch[2]) : null;
                                        const player = new YT.Player(id, {
                                            videoId: videoId,
                                            playerVars: { controls: 1, rel: 0 },
                                            events: {
                                                onStateChange: function(event) {
                                                    if (event.data === YT.PlayerState.ENDED) {
                                                        watched.add(vIndex);
                                                        progress.textContent = `${watched.size}/${vids.length} watched`;
                                                        if (watched.size === vids.length) attemptAutoClaim();
                                                    }
                                                }
                                            }
                                        });
                                        ytPlayers.push(player);
                                    });
                                }

                                if (typeof YT !== 'undefined' && typeof YT.Player !== 'undefined') {
                                    initYouTubePlayers();
                                } else {
                                    // Wait for global callback
                                    const prev = window.onYouTubeIframeAPIReady;
                                    window.onYouTubeIframeAPIReady = function() {
                                        if (typeof prev === 'function') prev();
                                        initYouTubePlayers();
                                    };
                                }
                            }

                            // Check if all watched already (edge cases)
                            const checkInterval = setInterval(() => {
                                if (watched.size === vids.length) {
                                    clearInterval(checkInterval);
                                }
                            }, 1000);

                        } catch (err) {
                            console.error('Failed to load videos for task', t.id, err);
                            const container = document.getElementById('videoContainer_' + t.id);
                            const progress = document.getElementById('videoProgress_' + t.id);
                            if (container) container.innerHTML = '<div style="color:#ef4444">Failed to load videos</div>';
                            if (progress) progress.textContent = '';
                        }
                    })(task);
                });
            } catch (err) {
                console.error('Failed to load Easy Earns tasks', err);
                listEl.innerHTML = '<div style="color:#ef4444">Failed to load tasks. Please try again later.</div>';
            }
        }

        function escapeHtml(s){ return String(s||'').replace(/[&<>\\"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
        function escapeAttr(s){ return String(s||'').replace(/'/g, "\\'").replace(/\\"/g,'\\\\\"'); }

        let currentTaskId = null;

        function openEasyModal(id, title, desc, amount) {
            currentTaskId = id;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc || '';
            document.getElementById('proofInput').value = '';
            document.getElementById('submitProofBtn').style.display = '';
            document.getElementById('claimRewardBtn').style.display = 'none';
            document.getElementById('easyModal').style.display = 'flex';
        }

        document.getElementById('closeModalBtn').addEventListener('click', ()=>{ document.getElementById('easyModal').style.display='none'; });

        document.getElementById('submitProofBtn').addEventListener('click', async ()=>{
            const url = document.getElementById('proofInput').value.trim();
            if (!url) return alert('Please provide a screenshot URL or short notes.');
            try {
                document.getElementById('submitProofBtn').disabled = true;
                document.getElementById('submitProofBtn').textContent = 'Submitting...';
                const res = await window.API.submitEasyEarn(currentTaskId, url);
                alert(res.message || 'Submission successful');
                document.getElementById('submitProofBtn').style.display = 'none';
                document.getElementById('claimRewardBtn').style.display = '';
            } catch (err) {
                alert(err.message || 'Submission failed');
            } finally {
                document.getElementById('submitProofBtn').disabled = false;
                document.getElementById('submitProofBtn').textContent = 'Submit Proof';
            }
        });

        document.getElementById('claimRewardBtn').addEventListener('click', async ()=>{
            try {
                document.getElementById('claimRewardBtn').disabled = true;
                document.getElementById('claimRewardBtn').textContent = 'Claiming...';
                const res = await window.API.claimEasyEarn(currentTaskId);
                alert(res.message || `You earned GHC ${res.earned}`);
                document.getElementById('easyModal').style.display = 'none';
                // refresh tasks & balance
                await loadEasyEarns();
                await window.API.getWallet().catch(()=>{});
                window.dispatchEvent(new Event('userFinanceUpdated'));
            } catch (err) {
                alert(err.message || 'Claim failed');
            } finally {
                document.getElementById('claimRewardBtn').disabled = false;
                document.getElementById('claimRewardBtn').textContent = 'Claim Reward';
            }
        });

        // Load on page ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadEasyEarns);
        } else {
            loadEasyEarns();
        }
    </script>
    </div>
</body>
</html>
