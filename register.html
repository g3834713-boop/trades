<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DailyTrade - Register</title>
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" />
    <style>
        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-alt: #f9f9f9;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #e0e0e0;
            --brand: #4361ee;
            --brand-hover: #3451d4;
            --brand-soft: rgba(67, 97, 238, 0.1);
            --brand-soft-solid: #f0f4ff;
            --shadow: rgba(0, 0, 0, 0.1);
            --danger: #e74c3c;
            --danger-bg: #ffeeee; --danger-text: #cc3333; --danger-border: #ffcccc;
            --success-bg: #d4edda; --success-text: #155724;
            --info-bg: #e8f4fd; --info-text: #0066cc; --info-border: #b3d9f2;
        }

        [data-theme="dark"] {
            --bg: #0f1115;
            --surface: #1a1d24;
            --surface-alt: #20242c;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border: #2d3139;
            --brand: #6b83ff;
            --brand-hover: #8299ff;
            --brand-soft: rgba(107, 131, 255, 0.18);
            --brand-soft-solid: #1e2544;
            --shadow: rgba(0, 0, 0, 0.4);
            --danger: #f87171;
            --danger-bg: #3a1414; --danger-text: #f87171; --danger-border: #5c2323;
            --success-bg: #16321f; --success-text: #4ade80;
            --info-bg: #1a2c3d; --info-text: #7dd3fc; --info-border: #234459;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px var(--shadow);
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            margin-bottom: 16px;
            text-align: center;
            display: flex;
            justify-content: center;
        }

        [data-theme="dark"] .logo {
            background: #ffffff;
            border-radius: 14px;
            padding: 8px 18px;
            display: inline-flex;
            margin-left: auto;
            margin-right: auto;
        }

        .logo img {
            height: 80px;
            width: auto;
            display: block;
        }

        .header-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-row .form-group {
            margin-bottom: 0;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-alt);
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: var(--brand);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--brand-soft);
        }

        .input-icon {
            padding: 0 12px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-box {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 0;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
        }

        .input-box::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            padding: 0 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--brand);
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .strength-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s, background-color 0.3s;
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            margin: 20px 0 24px 0;
            gap: 10px;
        }

        .terms-checkbox input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--brand);
        }

        .terms-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .terms-text a {
            color: var(--brand);
            text-decoration: none;
        }

        .terms-text a:hover {
            text-decoration: underline;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .register-button:hover:not(:disabled) {
            background: var(--brand-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--brand-soft);
        }

        .register-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            padding: 0 16px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .social-login {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
        }

        .social-btn:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: var(--brand-soft-solid);
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 16px;
        }

        .footer-text a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            color: var(--brand-hover);
        }

        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--surface);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .language-switcher:hover {
            border-color: var(--brand);
            color: var(--brand);
        }

        .phone-input-prefix {
            padding: 0 12px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            border-right: 1px solid var(--border);
        }

        .error-message {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .input-container.error {
            border-color: var(--danger);
        }

        .success-message {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .status-message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-bg);
        }

        .status-message.info {
            background: var(--info-bg);
            color: var(--info-text);
            border: 1px solid var(--info-border);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 24px 16px;
            }

            .logo {
                font-size: 24px;
            }

            .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <i class="las la-globe"></i>
        <span>EN</span>
    </div>

    <div class="register-container">
        <div class="register-card">
            <div class="header">
                <div class="logo">
                    <img src="logo.png?v=2" alt="DailyTrade">
                </div>
                <div class="header-text">Create your account</div>
            </div>

            <div class="success-message" id="successMessage">
                Account created successfully! Redirecting to login...
            </div>

            <form id="registerForm">
                <!-- Status Message -->
                <div id="statusMessage" class="status-message"></div>

                <!-- First Name & Last Name -->
                <div class="input-row">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <div class="input-container">
                            <i class="las la-user input-icon"></i>
                            <input 
                                type="text" 
                                class="input-box" 
                                id="firstName"
                                placeholder="First name"
                                required
                            >
                        </div>
                        <div class="error-message" id="firstNameError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <div class="input-container">
                            <i class="las la-user input-icon"></i>
                            <input 
                                type="text" 
                                class="input-box" 
                                id="lastName"
                                placeholder="Last name"
                                required
                            >
                        </div>
                        <div class="error-message" id="lastNameError"></div>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-container">
                        <i class="las la-envelope input-icon"></i>
                        <input 
                            type="email" 
                            class="input-box" 
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <div class="error-message" id="emailError"></div>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <div class="input-container">
                        <span class="phone-input-prefix">+233</span>
                        <input 
                            type="tel" 
                            class="input-box" 
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>
                    <div class="error-message" id="phoneError"></div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-container">
                        <i class="las la-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="password"
                            class="input-box" 
                            placeholder="Create a password"
                            required
                        >
                        <span class="toggle-password" onclick="togglePasswordField('password', 'eyeIcon1')">
                            <i class="las la-eye" id="eyeIcon1"></i>
                        </span>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span id="strengthText">Password strength: Weak</span>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-container">
                        <i class="las la-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="confirmPassword"
                            class="input-box" 
                            placeholder="Confirm your password"
                            required
                        >
                        <span class="toggle-password" onclick="togglePasswordField('confirmPassword', 'eyeIcon2')">
                            <i class="las la-eye" id="eyeIcon2"></i>
                        </span>
                    </div>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <!-- Referral Code (Optional) -->
                <div class="form-group">
                    <label class="form-label">Referral Code (Optional)</label>
                    <div class="input-container">
                        <i class="las la-gift input-icon"></i>
                        <input 
                            type="text" 
                            class="input-box" 
                            id="referralCode"
                            placeholder="Enter referral code"
                            style="text-transform: uppercase;"
                        >
                    </div>
                </div>

                <!-- Terms & Conditions -->
                <label class="terms-checkbox">
                    <input type="checkbox" id="termsCheckbox" required>
                    <span class="terms-text">
                        I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and
                        <a href="privacy.html" target="_blank">Privacy Policy</a>
                    </span>
                </label>

                <!-- Register Button -->
                <button type="submit" class="register-button" id="submitBtn">
                    <span id="buttonText">Create Account</span>
                </button>
            </form>

            <!-- Footer Text -->
            <div class="footer-text">
                Already have an account? <a href="index.html">Log in</a>
            </div>
        </div>
    </div>

    <script>
        // Show/hide status messages
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
        }

        function hideStatus() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.style.display = 'none';
        }

        function setLoading(isLoading, text = 'Create Account') {
            const button = document.getElementById('submitBtn');
            const buttonText = document.getElementById('buttonText');
            
            button.disabled = isLoading;
            
            if (isLoading) {
                buttonText.innerHTML = '<span class="loading-spinner"></span>' + text;
            } else {
                buttonText.textContent = text;
            }
        }

        // Password Strength Calculator
        function calculatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
            if (/\d/.test(password)) strength += 12;
            if (/[^a-zA-Z\d]/.test(password)) strength += 13;
            return Math.min(strength, 100);
        }

        // Update password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const strength = calculatePasswordStrength(this.value);
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            fill.style.width = strength + '%';

            if (strength < 30) {
                fill.style.backgroundColor = '#e74c3c';
                text.textContent = 'Password strength: Weak';
            } else if (strength < 60) {
                fill.style.backgroundColor = '#f39c12';
                text.textContent = 'Password strength: Fair';
            } else if (strength < 80) {
                fill.style.backgroundColor = '#f1c40f';
                text.textContent = 'Password strength: Good';
            } else {
                fill.style.backgroundColor = '#27ae60';
                text.textContent = 'Password strength: Strong';
            }
        });

        // Toggle password visibility
        function togglePasswordField(fieldId, iconId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'las la-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'las la-eye';
            }
        }

        // Form Validation
        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        function validatePhone(phone) {
            const regex = /^[0-9]{9,}$/;
            return regex.test(phone.replace(/\D/g, ''));
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const container = document.querySelector(`#${fieldId}`).closest('.input-container');
            if (errorElement) {
                errorElement.classList.remove('show');
                container.classList.remove('error');
            }
        }

        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const container = document.querySelector(`#${fieldId}`).closest('.input-container');
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
                container.classList.add('error');
            }
        }

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Clear all previous errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.input-container').forEach(el => el.classList.remove('error'));

            let isValid = true;

            // Get form values
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('termsCheckbox').checked;

            // Validate first name
            if (firstName.length < 2) {
                showError('firstName', 'First name must be at least 2 characters');
                isValid = false;
            }

            // Validate last name
            if (lastName.length < 2) {
                showError('lastName', 'Last name must be at least 2 characters');
                isValid = false;
            }

            // Validate email
            if (!validateEmail(email)) {
                showError('email', 'Please enter a valid email address');
                isValid = false;
            }

            // Validate phone
            if (!validatePhone(phone)) {
                showError('phone', 'Please enter a valid phone number');
                isValid = false;
            }

            // Validate password
            if (password.length < 8) {
                showError('password', 'Password must be at least 8 characters');
                isValid = false;
            }

            // Validate password match
            if (password !== confirmPassword) {
                showError('confirmPassword', 'Passwords do not match');
                isValid = false;
            }

            // Validate terms
            if (!termsAccepted) {
                alert('Please accept the Terms of Service and Privacy Policy');
                isValid = false;
            }

            if (isValid) {
                // Hide any previous messages
                hideStatus();
                
                // Show loading state
                setLoading(true, 'Creating Account...');
                showStatus('Setting up your account...', 'info');

                (async () => {
                    try {
                        const fullName = `${firstName} ${lastName}`;
                        const formattedPhone = '+233' + phone;
                        
                        // Wait for AuthService to be available
                        if (typeof window.AuthService === 'undefined') {
                            throw new Error('Authentication service not loaded. Please refresh the page.');
                        }

                        showStatus('Registering your account...', 'info');
                        const referralCode = document.getElementById('referralCode').value.trim();
                        const result = await window.AuthService.register(email, password, fullName, formattedPhone, referralCode);
                        
                        // Check if email confirmation is required
                        if (result.requiresEmailConfirmation) {
                            // Redirect to confirmation page
                            window.location.href = 'confirm-email.html?email=' + encodeURIComponent(email);
                            return;
                        }
                        
                        // Show success message
                        hideStatus();
                        showStatus('Account created successfully! Redirecting...', 'success');
                        setLoading(false, 'Account Created!');

                        // Redirect to login
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } catch (error) {
                        console.error('Registration error:', error);
                        
                        // Reset button state
                        setLoading(false);
                        
                        // Handle rate limit error
                        let errorMessage = 'Registration failed. Please try again.';
                        if (error.message && error.message.toLowerCase().includes('rate limit')) {
                            errorMessage = 'Too many registration attempts. Please wait a few minutes and try again.';
                        } else if (error.message && error.message.toLowerCase().includes('already registered')) {
                            errorMessage = 'This email is already registered. Please login instead.';
                        } else if (error.message) {
                            errorMessage = error.message;
                        }
                        
                        showStatus(errorMessage, 'error');
                    }
                })();
            }
        });

        // Social login handler
        // Auto-populate referral code from URL
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                document.getElementById('referralCode').value = ref.toUpperCase();
            }
        })();

        // Real-time validation
        document.getElementById('firstName').addEventListener('blur', function() {
            if (this.value.trim().length >= 2) {
                clearError('firstName');
            }
        });

        document.getElementById('lastName').addEventListener('blur', function() {
            if (this.value.trim().length >= 2) {
                clearError('lastName');
            }
        });

        document.getElementById('email').addEventListener('blur', function() {
            if (validateEmail(this.value.trim())) {
                clearError('email');
            }
        });

        document.getElementById('phone').addEventListener('blur', function() {
            if (validatePhone(this.value.trim())) {
                clearError('phone');
            }
        });
    </script>
</body>
</html>
