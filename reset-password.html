<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DailyTrade - Reset Password</title>
    <script src="theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" />
    <style>
        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-alt: #f9f9f9;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #e0e0e0;
            --brand: #4361ee;
            --brand-hover: #3451d4;
            --brand-soft: rgba(67, 97, 238, 0.1);
            --shadow: rgba(0, 0, 0, 0.1);
            --danger-bg: #ffeeee; --danger-text: #cc3333; --danger-border: #ffcccc;
            --success-bg: #eeffee; --success-text: #339933; --success-border: #ccffcc;
            --info-bg: #e8f4fd; --info-text: #0066cc; --info-border: #b3d9f2;
        }

        [data-theme="dark"] {
            --bg: #0f1115;
            --surface: #1a1d24;
            --surface-alt: #20242c;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border: #2d3139;
            --brand: #6b83ff;
            --brand-hover: #8299ff;
            --brand-soft: rgba(107, 131, 255, 0.18);
            --shadow: rgba(0, 0, 0, 0.4);
            --danger-bg: #3a1414; --danger-text: #f87171; --danger-border: #5c2323;
            --success-bg: #16321f; --success-text: #4ade80; --success-border: #1f4a2b;
            --info-bg: #1a2c3d; --info-text: #7dd3fc; --info-border: #234459;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .login-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px var(--shadow);
            width: 100%;
            max-width: 420px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            margin-bottom: 16px;
            text-align: center;
            display: flex;
            justify-content: center;
        }

        [data-theme="dark"] .logo {
            background: #ffffff;
            border-radius: 14px;
            padding: 8px 18px;
            display: inline-flex;
            margin-left: auto;
            margin-right: auto;
        }

        .logo img {
            height: 80px;
            width: auto;
            display: block;
        }

        .header-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-alt);
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: var(--brand);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--brand-soft);
        }

        .input-icon {
            padding: 0 12px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-box {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 0;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
        }

        .input-box::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            padding: 0 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--brand);
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            margin-top: 8px;
        }

        .submit-button:hover {
            background: var(--brand-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--brand-soft);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        .footer-text a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: var(--brand-hover);
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .status-message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .status-message.info {
            background: var(--info-bg);
            color: var(--info-text);
            border: 1px solid var(--info-border);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
                margin: 0 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="header">
                <div class="logo">
                    <img src="logo.png?v=2" alt="DailyTrade">
                </div>
                <div class="header-text" id="headerText">Set a new password</div>
            </div>

            <div id="statusMessage" class="status-message"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <div class="input-container">
                        <i class="las la-lock input-icon"></i>
                        <input
                            type="password"
                            id="newPasswordInput"
                            class="input-box"
                            placeholder="Enter new password"
                            required
                            minlength="6"
                        >
                        <span class="toggle-password" onclick="togglePassword('newPasswordInput', 'eyeIcon1')">
                            <i class="las la-eye" id="eyeIcon1"></i>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-container">
                        <i class="las la-lock input-icon"></i>
                        <input
                            type="password"
                            id="confirmPasswordInput"
                            class="input-box"
                            placeholder="Confirm new password"
                            required
                            minlength="6"
                        >
                        <span class="toggle-password" onclick="togglePassword('confirmPasswordInput', 'eyeIcon2')">
                            <i class="las la-eye" id="eyeIcon2"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="submit-button" id="submitButton">
                    <span id="buttonText">Update Password</span>
                </button>
            </form>

            <div class="footer-text">
                <a href="index.html">Back to login</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'las la-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'las la-eye';
            }
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
        }

        function setLoading(isLoading) {
            const button = document.getElementById('submitButton');
            const buttonText = document.getElementById('buttonText');
            button.disabled = isLoading;
            buttonText.innerHTML = isLoading
                ? '<span class="loading-spinner"></span>Updating...'
                : 'Update Password';
        }

        function disableForm() {
            document.getElementById('resetForm').style.display = 'none';
        }

        // Wait for auth.js to process the recovery token from the URL, then verify a session exists.
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                try {
                    if (typeof window.AuthService === 'undefined') {
                        throw new Error('Authentication service not loaded. Please refresh the page.');
                    }
                    const session = await window.AuthService.getSession();
                    if (!session) {
                        document.getElementById('headerText').textContent = 'Link expired or invalid';
                        showStatus('This password reset link is invalid or has expired. Please request a new one from the login page.', 'error');
                        disableForm();
                    }
                } catch (error) {
                    console.error('Session check error:', error);
                    document.getElementById('headerText').textContent = 'Link expired or invalid';
                    showStatus('This password reset link is invalid or has expired. Please request a new one from the login page.', 'error');
                    disableForm();
                }
            }, 800);
        });

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;

            if (newPassword !== confirmPassword) {
                showStatus('Passwords do not match.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showStatus('Password must be at least 6 characters.', 'error');
                return;
            }

            try {
                setLoading(true);
                await window.AuthService.updatePassword(newPassword);
                showStatus('Password updated! Redirecting to login...', 'success');
                disableForm();
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                console.error('Update password error:', error);
                setLoading(false);
                showStatus(error.message || 'Failed to update password. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
