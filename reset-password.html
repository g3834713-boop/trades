<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DailyTrade - Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .login-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            margin-bottom: 16px;
            text-align: center;
            display: flex;
            justify-content: center;
        }

        .logo img {
            height: 80px;
            width: auto;
            display: block;
        }

        .header-text {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: #4361ee;
            background: white;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .input-icon {
            padding: 0 12px;
            color: #999;
            font-size: 18px;
        }

        .input-box {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 0;
            background: transparent;
            font-size: 14px;
            color: #333;
        }

        .input-box::placeholder {
            color: #999;
        }

        .toggle-password {
            padding: 0 12px;
            cursor: pointer;
            color: #999;
            font-size: 18px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #4361ee;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            margin-top: 8px;
        }

        .submit-button:hover {
            background: #3451d4;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 97, 238, 0.3);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 20px;
        }

        .footer-text a {
            color: #4361ee;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: #3451d4;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .status-message.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .status-message.info {
            background: #e8f4fd;
            color: #0066cc;
            border: 1px solid #b3d9f2;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
                margin: 0 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="header">
                <div class="logo">
                    <img src="logo.png?v=2" alt="DailyTrade">
                </div>
                <div class="header-text" id="headerText">Set a new password</div>
            </div>

            <div id="statusMessage" class="status-message"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <div class="input-container">
                        <i class="las la-lock input-icon"></i>
                        <input
                            type="password"
                            id="newPasswordInput"
                            class="input-box"
                            placeholder="Enter new password"
                            required
                            minlength="6"
                        >
                        <span class="toggle-password" onclick="togglePassword('newPasswordInput', 'eyeIcon1')">
                            <i class="las la-eye" id="eyeIcon1"></i>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-container">
                        <i class="las la-lock input-icon"></i>
                        <input
                            type="password"
                            id="confirmPasswordInput"
                            class="input-box"
                            placeholder="Confirm new password"
                            required
                            minlength="6"
                        >
                        <span class="toggle-password" onclick="togglePassword('confirmPasswordInput', 'eyeIcon2')">
                            <i class="las la-eye" id="eyeIcon2"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="submit-button" id="submitButton">
                    <span id="buttonText">Update Password</span>
                </button>
            </form>

            <div class="footer-text">
                <a href="index.html">Back to login</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'las la-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'las la-eye';
            }
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
        }

        function setLoading(isLoading) {
            const button = document.getElementById('submitButton');
            const buttonText = document.getElementById('buttonText');
            button.disabled = isLoading;
            buttonText.innerHTML = isLoading
                ? '<span class="loading-spinner"></span>Updating...'
                : 'Update Password';
        }

        function disableForm() {
            document.getElementById('resetForm').style.display = 'none';
        }

        // Wait for auth.js to process the recovery token from the URL, then verify a session exists.
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                try {
                    if (typeof window.AuthService === 'undefined') {
                        throw new Error('Authentication service not loaded. Please refresh the page.');
                    }
                    const session = await window.AuthService.getSession();
                    if (!session) {
                        document.getElementById('headerText').textContent = 'Link expired or invalid';
                        showStatus('This password reset link is invalid or has expired. Please request a new one from the login page.', 'error');
                        disableForm();
                    }
                } catch (error) {
                    console.error('Session check error:', error);
                    document.getElementById('headerText').textContent = 'Link expired or invalid';
                    showStatus('This password reset link is invalid or has expired. Please request a new one from the login page.', 'error');
                    disableForm();
                }
            }, 800);
        });

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;

            if (newPassword !== confirmPassword) {
                showStatus('Passwords do not match.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showStatus('Password must be at least 6 characters.', 'error');
                return;
            }

            try {
                setLoading(true);
                await window.AuthService.updatePassword(newPassword);
                showStatus('Password updated! Redirecting to login...', 'success');
                disableForm();
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                console.error('Update password error:', error);
                setLoading(false);
                showStatus(error.message || 'Failed to update password. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
