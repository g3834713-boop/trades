<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Email Confirmation Required</title>
  <style>
    html, body { overflow-x: hidden; width: 100%; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; padding: 16px; }
    .container { max-width: 420px; margin: 80px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #eee; padding: 32px; text-align: center; }
    .btn { background: #4361ee; color: #fff; border: none; border-radius: 6px; padding: 12px 24px; font-size: 16px; margin-top: 24px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: #274bb5; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Confirm Your Email</h2>
    <p>Thank you for signing up!<br>
    Please check your email and click the confirmation link to activate your account.</p>
    <p>If you don't see the email, check your spam folder or <a href="#" onclick="window.location.reload()">refresh this page</a>.</p>
    <a class="btn" href="mailto:?">Open Email App</a>
    <p style="margin-top: 32px; color: #888; font-size: 13px;">Once confirmed, you can <a href="index.html">login here</a>.</p>
  </div>
  <script>
    // Optionally, show the user's email
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) {
      const p = document.createElement('p');
      p.style.color = '#888';
      p.style.fontSize = '13px';
      p.textContent = 'Confirmation sent to: ' + email;
      document.querySelector('.container').appendChild(p);
    }
  </script>
</body>
</html>
