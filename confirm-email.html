<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Email Confirmation Required</title>
  <script src="theme.js"></script>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text-primary: #222222;
      --text-muted: #888888;
      --shadow: #eeeeee;
      --brand: #4361ee;
      --brand-hover: #274bb5;
    }
    [data-theme="dark"] {
      --bg: #0f1115;
      --surface: #1a1d24;
      --text-primary: #e5e7eb;
      --text-muted: #9ca3af;
      --shadow: rgba(0, 0, 0, 0.4);
      --brand: #6b83ff;
      --brand-hover: #8299ff;
    }
    html, body { overflow-x: hidden; width: 100%; }
    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text-primary); padding: 16px; transition: background-color 0.2s ease, color 0.2s ease; }
    .container { max-width: 420px; margin: 80px auto; background: var(--surface); border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); padding: 32px; text-align: center; }
    a { color: var(--brand); }
    .btn { background: var(--brand); color: #fff; border: none; border-radius: 6px; padding: 12px 24px; font-size: 16px; margin-top: 24px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: var(--brand-hover); }
  </style>
</head>
<body>
  <div class="container">
    <h2>Confirm Your Email</h2>
    <p>Thank you for signing up!<br>
    Please check your email and click the confirmation link to activate your account.</p>
    <p>If you don't see the email, check your spam folder or <a href="#" onclick="window.location.reload()">refresh this page</a>.</p>
    <a class="btn" href="mailto:?">Open Email App</a>
    <p style="margin-top: 32px; color: var(--text-muted); font-size: 13px;">Once confirmed, you can <a href="index.html">login here</a>.</p>
  </div>
  <script>
    // Optionally, show the user's email
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) {
      const p = document.createElement('p');
      p.style.color = 'var(--text-muted)';
      p.style.fontSize = '13px';
      p.textContent = 'Confirmation sent to: ' + email;
      document.querySelector('.container').appendChild(p);
    }
  </script>
</body>
</html>
