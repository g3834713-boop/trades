services:
  - type: web
    name: dailytrade-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DB_POOL_MAX
        value: "3"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DB_SLOW_QUERY_MS
        value: "1500"

  - type: web
    name: dailytrade-whatsapp-bot
    runtime: node
    rootDir: whatsapp-bot
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SITE_API_URL
        value: https://dailytrade-backend.onrender.com
      - key: SCHEDULER_API_KEY
        sync: false
      - key: WHATSAPP_TARGET_JID
        sync: false
