<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DailyTrade - Login</title>
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" />
    <style>
        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-alt: #f9f9f9;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #e0e0e0;
            --brand: #4361ee;
            --brand-hover: #3451d4;
            --brand-soft: rgba(67, 97, 238, 0.1);
            --shadow: rgba(0, 0, 0, 0.1);
            --danger-bg: #ffeeee; --danger-text: #cc3333; --danger-border: #ffcccc;
            --success-bg: #eeffee; --success-text: #339933; --success-border: #ccffcc;
            --info-bg: #e8f4fd; --info-text: #0066cc; --info-border: #b3d9f2;
        }

        [data-theme="dark"] {
            --bg: #0f1115;
            --surface: #1a1d24;
            --surface-alt: #20242c;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border: #2d3139;
            --brand: #6b83ff;
            --brand-hover: #8299ff;
            --brand-soft: rgba(107, 131, 255, 0.18);
            --shadow: rgba(0, 0, 0, 0.4);
            --danger-bg: #3a1414; --danger-text: #f87171; --danger-border: #5c2323;
            --success-bg: #16321f; --success-text: #4ade80; --success-border: #1f4a2b;
            --info-bg: #1a2c3d; --info-text: #7dd3fc; --info-border: #234459;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .login-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px var(--shadow);
            width: 100%;
            max-width: 420px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            margin-bottom: 16px;
            text-align: center;
            display: flex;
            justify-content: center;
        }

        [data-theme="dark"] .logo {
            background: #ffffff;
            border-radius: 14px;
            padding: 8px 18px;
            display: inline-flex;
            margin-left: auto;
            margin-right: auto;
        }

        .logo img {
            height: 80px;
            width: auto;
            display: block;
        }

        .header-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-alt);
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: var(--brand);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--brand-soft);
        }

        .input-icon {
            padding: 0 12px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-box {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 0;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
        }

        .input-box::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            padding: 0 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--brand);
        }

        .forgot-password {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-password a {
            font-size: 12px;
            color: var(--brand);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-password a:hover {
            color: var(--brand-hover);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            margin-top: 24px;
        }

        .login-button:hover {
            background: var(--brand-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--brand-soft);
        }

        .login-button:active {
            transform: translateY(0);
        }





        .footer-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        .footer-text a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: var(--brand-hover);
        }

        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--surface);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .language-switcher:hover {
            border-color: var(--brand);
            color: var(--brand);
        }

        .phone-input-prefix {
            padding: 0 12px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            border-right: 1px solid var(--border);
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .status-message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .status-message.info {
            background: var(--info-bg);
            color: var(--info-text);
            border: 1px solid var(--info-border);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
                margin: 0 16px;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <i class="las la-globe"></i>
        <span>EN</span>
    </div>

    <div class="login-container mx-4">
        <div class="login-card">
            <div class="header">
                <div class="logo">
                    <img src="logo.png?v=2" alt="DailyTrade">
                </div>
                <div class="header-text">Welcome back</div>
            </div>

            <form id="loginForm">
                <!-- Status Message -->
                <div id="statusMessage" class="status-message"></div>

                <!-- Email Input -->
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-container">
                        <i class="las la-envelope input-icon"></i>
                        <input 
                            type="email" 
                            id="emailInput"
                            class="input-box" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-container">
                        <i class="las la-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="passwordInput"
                            class="input-box" 
                            placeholder="Enter your password"
                            required
                        >
                        <span class="toggle-password" onclick="togglePassword()">
                            <i class="las la-eye" id="eyeIcon"></i>
                        </span>
                    </div>
                    <div class="forgot-password">
                        <a href="#" onclick="toggleForgotPassword(event)">Forgot password?</a>
                    </div>
                </div>

                <!-- Forgot Password Panel -->
                <div id="forgotPasswordPanel" style="display: none; margin-bottom: 20px; padding: 16px; background: var(--surface-alt); border-radius: 8px;">
                    <label class="form-label" style="margin-bottom: 8px;">Enter your email to reset your password</label>
                    <div class="input-container" style="margin-bottom: 10px;">
                        <i class="las la-envelope input-icon"></i>
                        <input
                            type="email"
                            id="forgotEmailInput"
                            class="input-box"
                            placeholder="Enter your email"
                        >
                    </div>
                    <button type="button" class="login-button" id="forgotSubmitBtn" onclick="sendPasswordReset()" style="margin-top: 0;">
                        Send Reset Link
                    </button>
                </div>

                <!-- Two-Factor Authentication Panel (shown after password is verified, if this account requires it) -->
                <div id="totpPanel" style="display: none; margin-bottom: 20px; padding: 16px; background: var(--surface-alt); border-radius: 8px;">
                    <label class="form-label" style="margin-bottom: 8px;">Enter the 6-digit code from your authenticator app</label>
                    <div class="input-container" style="margin-bottom: 10px;">
                        <i class="las la-shield-alt input-icon"></i>
                        <input
                            type="text"
                            id="totpCodeInput"
                            class="input-box"
                            placeholder="123456"
                            inputmode="numeric"
                            maxlength="6"
                            autocomplete="one-time-code"
                        >
                    </div>
                    <button type="button" class="login-button" id="totpSubmitBtn" onclick="verifyTotpLogin()" style="margin-top: 0;">
                        Verify
                    </button>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-button" id="loginButton">
                    <span id="buttonText">Log in</span>
                </button>
            </form>

            <!-- Footer Text -->
            <div class="footer-text">
                Don't have an account? <a href="register.html">Register</a>
            </div>

        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'las la-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'las la-eye';
            }
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
        }

        function hideStatus() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.style.display = 'none';
        }

        function toggleForgotPassword(e) {
            e.preventDefault();
            const panel = document.getElementById('forgotPasswordPanel');
            const isHidden = panel.style.display === 'none';
            panel.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                const emailVal = document.getElementById('emailInput').value.trim();
                const forgotEmailInput = document.getElementById('forgotEmailInput');
                if (emailVal) forgotEmailInput.value = emailVal;
                forgotEmailInput.focus();
            }
        }

        async function sendPasswordReset() {
            const email = document.getElementById('forgotEmailInput').value.trim();
            hideStatus();

            if (!email) {
                showStatus('Please enter your email address.', 'error');
                return;
            }

            const btn = document.getElementById('forgotSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                if (typeof window.AuthService === 'undefined') {
                    throw new Error('Authentication service not loaded. Please refresh the page.');
                }
                await window.AuthService.resetPasswordForEmail(email);
                showStatus('Password reset link sent! Check your email.', 'success');
                document.getElementById('forgotPasswordPanel').style.display = 'none';
            } catch (error) {
                console.error('Reset password error:', error);
                showStatus(error.message || 'Failed to send reset link. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        }

        function setLoading(isLoading, text = 'Log in') {
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            
            button.disabled = isLoading;
            
            if (isLoading) {
                buttonText.innerHTML = '<span class="loading-spinner"></span>' + text;
            } else {
                buttonText.textContent = text;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            
            // Hide any previous messages
            hideStatus();
            
            try {
                if (typeof window.AuthService === 'undefined') {
                    throw new Error('Authentication service not loaded. Please refresh the page.');
                }

                // Show logging in status
                setLoading(true, 'Logging in...');
                showStatus('Verifying your credentials...', 'info');

                const result = await window.AuthService.login(email, password);

                if (result.mfaRequired) {
                    await beginTotpChallenge();
                    return;
                }

                // Update status for sync
                showStatus('Setting up your account...', 'info');
                
                try {
                    // Ensure user exists in backend database
                    await window.API.call('/users/sync', {
                        method: 'POST',
                        body: JSON.stringify({ fullName: null, phone: null })
                    });
                } catch (syncError) {
                    console.warn('User sync failed:', syncError);
                }
                
                // Show success message
                showStatus('Login successful! Redirecting...', 'success');
                
                // Redirect after a brief moment
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 500);
                
            } catch (error) {
                console.error('Login error:', error);
                
                // Reset button state
                setLoading(false);
                
                // Handle different error types
                let errorMessage = 'Invalid email or password';
                if (error.message && error.message.toLowerCase().includes('rate limit')) {
                    errorMessage = 'Too many login attempts. Please wait a few minutes and try again.';
                } else if (error.message && error.message.toLowerCase().includes('invalid')) {
                    errorMessage = 'Invalid email or password. Please check your credentials.';
                } else if (error.message) {
                    errorMessage = error.message;
                }
                
                showStatus(errorMessage, 'error');
            }
        });

        // --- Two-Factor Authentication (authenticator app) step-up ---
        let pendingTotpFactorId = null;
        let pendingTotpChallengeId = null;

        async function beginTotpChallenge() {
            try {
                const factors = await window.AuthService.listMfaFactors();
                const totpFactor = (factors.totp || []).find(f => f.status === 'verified');
                if (!totpFactor) {
                    throw new Error('Two-factor authentication is required for this account, but no authenticator app is set up. Contact support.');
                }
                const challenge = await window.AuthService.challengeMfa(totpFactor.id);
                pendingTotpFactorId = totpFactor.id;
                pendingTotpChallengeId = challenge.id;

                document.getElementById('emailInput').closest('.form-group').style.display = 'none';
                document.getElementById('passwordInput').closest('.form-group').style.display = 'none';
                document.getElementById('loginButton').style.display = 'none';
                document.getElementById('totpPanel').style.display = 'block';
                setLoading(false);
                showStatus('Enter the code from your authenticator app to finish logging in.', 'info');
                document.getElementById('totpCodeInput').focus();
            } catch (error) {
                console.error('MFA challenge error:', error);
                setLoading(false);
                showStatus(error.message || 'Failed to start two-factor verification.', 'error');
            }
        }

        async function verifyTotpLogin() {
            const code = document.getElementById('totpCodeInput').value.trim();
            if (!code) {
                showStatus('Enter the 6-digit code from your authenticator app.', 'error');
                return;
            }

            const btn = document.getElementById('totpSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            hideStatus();

            try {
                await window.AuthService.completeMfaLogin(pendingTotpFactorId, pendingTotpChallengeId, code);

                try {
                    await window.API.call('/users/sync', {
                        method: 'POST',
                        body: JSON.stringify({ fullName: null, phone: null })
                    });
                } catch (syncError) {
                    console.warn('User sync failed:', syncError);
                }

                showStatus('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 500);
            } catch (error) {
                console.error('TOTP verify error:', error);
                showStatus(error.message || 'Invalid code. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Verify';
            }
        }
    </script>
</body>
</html>
